[package]
name = "image-sorter"
version = "0.1.0"
edition = "2024"
description = "Sort images by EXIF date and find exact duplicates"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.33"
kamadak-exif = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = "5"
walkdir = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
