[package]
name = "media-sift"
version = "0.1.0"
edition = "2024"
description = "Organize images and review exact duplicate media files"
license = "GPL-3.0-or-later"
authors = ["Mustache Mushroom"]
repository = "https://github.com/MustacheMushroom/MediaSift"
build = "build.rs"

[package.metadata.packager]
product-name = "MediaSift"
identifier = "com.mustachemushroom.media-sift"
publisher = "Mustache Mushroom"
homepage = "https://github.com/MustacheMushroom/MediaSift"
category = "Utility"
formats = ["nsis"]
icons = ["assets/media-sift-icon.ico"]
resources = ["LICENSE"]
before-packaging-command = "cargo build --release --locked"

[package.metadata.packager.nsis]
installMode = "perMachine"
installerIcon = "assets/media-sift-icon.ico"
languages = ["English"]

[dependencies]
chrono = "0.4"
eframe = "0.33"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "tiff"] }
kamadak-exif = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = "5"
walkdir = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
winresource = "0.1.31"
